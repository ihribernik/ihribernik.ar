services:
  web:
    image: ghcr.io/ihribernik/ihribernik.ar:${IMAGE_TAG:?IMAGE_TAG must be set}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/"]
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3
    labels:
      - traefik.enable=true
      - traefik.docker.network=proxy
      - traefik.http.routers.portfolio.rule=Host(`ihribernik.ar`)
      - traefik.http.routers.portfolio.entrypoints=websecure
      - traefik.http.routers.portfolio.tls=true
      - traefik.http.routers.portfolio.tls.certresolver=letsencrypt
      - traefik.http.routers.portfolio-www.rule=Host(`www.ihribernik.ar`)
      - traefik.http.routers.portfolio-www.entrypoints=websecure
      - traefik.http.routers.portfolio-www.tls=true
      - traefik.http.routers.portfolio-www.tls.certresolver=letsencrypt
      - traefik.http.routers.portfolio-www.middlewares=portfolio-www-redirect
      - traefik.http.middlewares.portfolio-www-redirect.redirectregex.regex=^https://www\.ihribernik\.ar/(.*)
      - traefik.http.middlewares.portfolio-www-redirect.redirectregex.replacement=https://ihribernik.ar/$${1}
      - traefik.http.middlewares.portfolio-www-redirect.redirectregex.permanent=true
      - traefik.http.services.portfolio.loadbalancer.server.port=80
    networks:
      - proxy

networks:
  proxy:
    external: true
    name: proxy
